[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "specfuse-loop"
version = "0.7.1"
description = "Local-first executor for the Specfuse Plan + Work Unit gate-cycle methodology."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
  { name = "Specfuse contributors" },
]
keywords = ["specfuse", "agents", "planning", "ralph", "gate-cycle"]
classifiers = [
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Intended Audience :: Developers",
  "Topic :: Software Development",
]
# The loop driver and linter have no runtime dependencies — YAML parsing is
# done by .specfuse/scripts/_miniyaml.py against the documented subset, using
# only the Python 3 standard library.
dependencies = []

# Dev tooling for this repo's own `code` gates (see .specfuse/verification.yml
# and scripts/smoke-test.sh). PyYAML is dev-only: the equivalence tests for
# _miniyaml compare its output against yaml.safe_load on every real file.
# ruff/bandit/coverage are for the reference implementation's own gates.
[project.optional-dependencies]
# The Azure provider SDKs. Kept OUT of the runtime dependencies on purpose: the
# package imports them lazily inside the transport factories, so `specfuse-loop`
# installs with zero runtime dependencies and the harvester's core stays
# provider-agnostic. Only an operator actually harvesting from Azure needs these.
azure = [
  "azure-identity>=1.15",
  "azure-servicebus>=7.11",
  "azure-monitor-query>=1.2",
]
dev = [
  "PyYAML>=6.0",
  "ruff>=0.6",
  "bandit>=1.7",
  "coverage>=7.0",
  "jsonschema>=4.0",
]

[project.urls]
Homepage = "https://github.com/specfuse/loop"
Source = "https://github.com/specfuse/loop"

# Target the loop's actual minimum Python (matches `requires-python`).
[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
# Pin the ruleset EXPLICITLY rather than relying on ruff's implicit default.
# ruff 0.16 broadened its default `select` to a large opinionated set
# (B/SIM/PLW/RUF/I/…); a bare config inherited that overnight and flagged ~300
# findings across code that had been clean for months — breaking CI on every PR
# purely from a version bump. This repo intends only the classic default
# (pyflakes + the core pycodestyle subset); pinning it here makes that intent
# version-independent. Adopting the broader ruleset is a separate, deliberate
# decision (see the roadmap), never an implicit consequence of upgrading ruff.
select = ["E4", "E7", "E9", "F", "PLW1510", "B", "BLE001", "S110", "TRY004"]

[project.scripts]
specfuse-loop = "specfuse.loop.loop:main"
specfuse-lint = "specfuse.loop.lint_plan:main"
specfuse-monitor-lint = "specfuse.loop.lint_monitoring:main"
specfuse-monitor = "specfuse.monitor.cli:main"
specfuse-stats = "specfuse.loop.events_stats:main"

[tool.setuptools.packages.find]
# Ship ONLY the specfuse namespace package. Without this scope, setuptools'
# auto-discovery sweeps tests/, docs/, and scripts/ into the wheel.
include = ["specfuse*"]
namespaces = true

[tool.setuptools.package-data]
# Include the scaffold seed so `specfuse init` / `specfuse upgrade` can copy
# templates, rules, and other seed files out of the wheel without needing the
# loop source repo on disk.
"specfuse.loop" = ["data/**/*", "data/*"]
