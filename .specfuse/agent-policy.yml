#
# This repo's own operator priorities, per FEAT-2026-0044/T02: feature-work
# queue order, gate-review and triage dials, budgets, and escalation contact
# points. Validated structurally by `specfuse/loop/agent_policy.py`
# (`validate_agent_policy`) and, since T02, cross-checked against
# `.specfuse/roadmap.md` — queue entries with no roadmap row are an ERROR,
# entries whose roadmap status has gone `done`/`abandoned` are a WARN.

version: 1

# Operator's stated sequence as of 2026-08-15, groomed via /groom-backlog and
# reordered the same day.
#
# FEAT-2026-0081 demoted from #2 to #4: its first slice re-runs the next-ID scan
# inside `/draft-feature` before that skill writes, and FEAT-2026-0050's gate 2
# adds the answered-questions write path to the same skill. Two in-flight
# features editing one prose surface is how one silently reverts the other's
# rule, so 0081 is sequenced behind the feature it collides with.
#
# 0050 is drafted (folder + armed gate 1) and is the only entry the feature lane
# can currently advance. 0058 is drafted next as the hedge: if 0050's gate 1
# escalates, the lane still has work, and 0058 touches lint_plan.py and a
# per-feature DECISIONS.md -- no overlap with 0050's surfaces.
#
# The remaining entries are still undrafted, so each produces a
# `drafting-needed` escalation rather than work until 0050 lands. Those
# escalations are no longer double-counted -- #2384 stopped the triage lane
# re-classifying them.
queue:
  - FEAT-2026-0050   # async drafting -- drafted, dispatchable
  - FEAT-2026-0058   # decision registry -- drafted next as the hedge
  - FEAT-2026-0052   # baseline-delta ratchet
  - FEAT-2026-0081   # ID collision -- behind 0050 g2, shares /draft-feature

rules:
  bugs:
    preempt: true
    min_severity: low
    automerge: "off"           # FEAT-2026-0048 owns enforcement; not built yet
    test_paths:                 # accepted at the FEAT-2026-0076 review: measured from
      - tests/                  # the tree and verification.yml gate commands, which agree
  features:
    gate_review: human
    wip_limit: 1
  triage:
    auto: false                # T03 wires this; false preserves today's behavior

budgets:
  max_tokens_per_run: 2000000
  max_open_prs: 3
  max_items_per_day: 10

escalation:
  webhook_env: ""               # env-var NAME holding the webhook URL, not the URL itself
  provider: none                # discord | slack | teams | none
  assignee: "clabonte"       # verified assignable: gh api repos/specfuse/loop/assignees/clabonte
  quiet_hours: ""
  sla_hours: 24
  silence_hours: 24
