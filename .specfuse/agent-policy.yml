#
# This repo's own operator priorities, per FEAT-2026-0044/T02: feature-work
# queue order, gate-review and triage dials, budgets, and escalation contact
# points. Validated structurally by `specfuse/loop/agent_policy.py`
# (`validate_agent_policy`) and, since T02, cross-checked against
# `.specfuse/roadmap.md` — queue entries with no roadmap row are an ERROR,
# entries whose roadmap status has gone `done`/`abandoned` are a WARN.

version: 1

# Operator's stated sequence as of 2026-08-23, groomed via /groom-backlog and
# accepted the same day. FEAT-2026-0050 and FEAT-2026-0058 dropped: both reached
# roadmap status `done`, which `validate_agent_policy` had been WARNing about.
#
# NOTHING IN THIS QUEUE HAS A FEATURE FOLDER. All eight `planned` roadmap rows
# were checked at grooming; none is drafted. So every entry below currently
# produces a `drafting-needed` escalation rather than work, and issues #2383 and
# #2381 -- the only two items `/attention` shows -- are exactly those escalations
# for 0052 and 0081. That is the state FEAT-2026-0082 exists to end, and its
# roadmap row measured it on 2026-08-15: four queue entries, four escalations,
# zero units of work. Unchanged eight days later.
#
# 0082 leads because until it lands this ordering barely matters -- the lane
# escalates on whatever sits at the top. Caveat recorded honestly: 0082 has no
# folder either, so it needs one human `/draft-feature` session before the lane
# can advance it.
#
# 0081 stays behind the drafting feature, as it was behind 0050. Its old blocker
# (0050's gate 2 editing `/draft-feature`) is discharged, but 0082 touches the
# same surface, so the reason is replaced rather than removed: two in-flight
# features editing one prose surface is how one silently reverts the other's
# rule.
#
# 0052 is the hedge -- lint and gate-baseline surfaces, no overlap with the
# drafting path, so the lane still has work if 0082 stalls.
#
# Deliberately NOT queued: 0074, 0077, 0038, 0043. Preconditions unmet, not low
# value -- 0077's own roadmap status says it "becomes worth building when a real
# repository's policy file carries tuned values". Queuing them would manufacture
# four more `drafting-needed` escalations.
queue:
  - FEAT-2026-0082   # wire async drafting end to end -- unblocks the queue itself
  - FEAT-2026-0081   # ID collision -- behind 0082, shares /draft-feature
  - FEAT-2026-0052   # baseline-delta ratchet -- the hedge, non-colliding surface
  - FEAT-2026-0078   # produces_incremental -- cheapest; reverted impl at 25e6bc5

rules:
  bugs:
    preempt: true
    min_severity: low
    # FEAT-2026-0048 shipped (roadmap: done) -- enforcement exists and is
    # live: `bug_lane.evaluate_merge_guardrails` requires test evidence,
    # a diff within `max_diff_lines`, no judge-path touched, traceable
    # provenance, green CI, and room under the rolling daily cap.
    #
    # Still "off" by operator choice, not for want of a mechanism. The dial
    # gates the merge only -- `run_bug_lane` invokes headless `/fix-bug` at
    # every setting, so "off" means a bug-lane PR waits for a human merge,
    # not that the lane is inert. Flip to "on" to let a PR clearing every
    # guardrail above merge itself.
    automerge: "off"
    # Declared rather than defaulted (#2715). `bug_lane_limits` falls back to
    # 150/3 when these are absent, so the bounds were real but invisible --
    # and they are what the dial's blast radius is made of.
    max_diff_lines: 150
    max_merges_per_day: 3
    test_paths:                 # accepted at the FEAT-2026-0076 review: measured from
      - tests/                  # the tree and verification.yml gate commands, which agree
  features:
    gate_review: human
    wip_limit: 1
  triage:
    auto: false                # T03 wires this; false preserves today's behavior

budgets:
  max_tokens_per_run: 2000000
  max_open_prs: 3
  max_items_per_day: 10

escalation:
  webhook_env: ""               # env-var NAME holding the webhook URL, not the URL itself
  provider: none                # discord | slack | teams | none
  assignee: "clabonte"       # verified assignable: gh api repos/specfuse/loop/assignees/clabonte
  quiet_hours: ""
  sla_hours: 24
  silence_hours: 24
