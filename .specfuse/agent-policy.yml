#
# This repo's own operator priorities, per FEAT-2026-0044/T02: feature-work
# queue order, gate-review and triage dials, budgets, and escalation contact
# points. Validated structurally by `specfuse/loop/agent_policy.py`
# (`validate_agent_policy`) and, since T02, cross-checked against
# `.specfuse/roadmap.md` — queue entries with no roadmap row are an ERROR,
# entries whose roadmap status has gone `done`/`abandoned` are a WARN.

version: 1

# Operator's stated sequence as of 2026-08-15, groomed via /groom-backlog.
# FEAT-2026-0079 dropped: shipped and `done` (PR #2344), which validate_agent_policy
# WARNed on.
#
# KNOWN CONSEQUENCE, accepted deliberately: none of these four has a feature folder,
# and an undrafted queue entry produces a `drafting-needed` escalation rather than
# work. That list is uncapped by `wip_limit`, so an unattended run will spend items
# on escalations until the top entry is drafted. FEAT-2026-0050 is #1 precisely
# because it is the fix for that -- async drafting via question issues -- and until
# it lands, drafting is the bottleneck every other entry hits first. Draft the top
# entry with /draft-feature before an unattended run to avoid the escalation flood.
queue:
  - FEAT-2026-0050   # async drafting -- unblocks drafting for everything below
  - FEAT-2026-0081   # ID collision -- live ambiguity, cheap, loop-owned surfaces
  - FEAT-2026-0058   # decision registry -- drift defects with measured cost
  - FEAT-2026-0052   # baseline-delta ratchet -- operator exits on a red base tree

rules:
  bugs:
    preempt: true
    min_severity: low
    automerge: "off"           # FEAT-2026-0048 owns enforcement; not built yet
    test_paths:                 # accepted at the FEAT-2026-0076 review: measured from
      - tests/                  # the tree and verification.yml gate commands, which agree
  features:
    gate_review: human
    wip_limit: 1
  triage:
    auto: false                # T03 wires this; false preserves today's behavior

budgets:
  max_tokens_per_run: 2000000
  max_open_prs: 3
  max_items_per_day: 10

escalation:
  webhook_env: ""               # env-var NAME holding the webhook URL, not the URL itself
  provider: none                # discord | slack | teams | none
  assignee: "clabonte"       # verified assignable: gh api repos/specfuse/loop/assignees/clabonte
  quiet_hours: ""
  sla_hours: 24
  silence_hours: 24
