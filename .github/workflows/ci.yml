#
# CI: run the repo's scaffold smoke-test PLUS every methodology `code` gate on
# push and PR. The script does both — this workflow just sets up Python and
# invokes it.
#
# There is no gate list here, and there must not be one. smoke-test.sh derives
# the gates from .specfuse/verification.yml at run time (#592); that file is
# the single source of truth. The previous "keep all three in sync" instruction
# was the drift: the hand-maintained copy fell six gates behind, and two of
# them shipped with features and were never once executed.

name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install runtime + dev tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Install bats (leak-scan gate)
        run: |
          sudo apt-get update
          sudo apt-get install -y bats

      # gitleaks is the leak-scan gate's ORACLE, so its version is pinned and
      # installed from the release binary unconditionally. Never `apt-get install
      # gitleaks`: apt carries different builds per runner image (8.18.x on
      # noble), their rulesets disagree, and preferring apt made the gate's
      # verdict change with no change to the repo — see #250. The pin must match
      # leak_scan.GITLEAKS_PINNED_VERSION; tests/test_gitleaks_pinning.py
      # enforces that.
      - name: Install gitleaks (pinned — leak-scan oracle)
        run: |
          curl -fsSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            | sudo tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Run scaffold smoke-test + code gates
        run: ./scripts/smoke-test.sh

  windows-smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Import driver module
        run: python -c "import specfuse.loop.loop"

      - name: Dry-run walk the bundled example
        run: python .specfuse/scripts/loop.py --feature FEAT-2026-0001-health-endpoint --dry-run

      - name: Real-Windows gate-exec oracle (Git-Bash routing + python3 normalization)
        run: python -m unittest tests.test_windows_gate_exec -v
